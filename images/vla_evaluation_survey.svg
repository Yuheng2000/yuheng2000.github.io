<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">VLA Evaluation Survey thumbnail</title>
  <desc id="desc">A schematic thumbnail for a survey on the evaluation bottleneck of vision-language-action models.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#e8eef5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#263548" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="10" refX="13" refY="5" orient="auto">
      <path d="M0,0 L14,5 L0,10 Z" fill="#36516f"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <g opacity="0.35" stroke="#bcc8d6" stroke-width="1">
    <path d="M80 120H1120M80 220H1120M80 320H1120M80 420H1120M80 520H1120M80 620H1120"/>
    <path d="M160 70V650M320 70V650M480 70V650M640 70V650M800 70V650M960 70V650"/>
  </g>
  <text x="600" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#1d2b3a">VLA Model Evaluation</text>
  <text x="600" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#516174">An evaluation-centric survey</text>

  <g filter="url(#shadow)">
    <rect x="102" y="220" width="210" height="112" rx="18" fill="#ffffff" stroke="#8fb3d9" stroke-width="3"/>
    <rect x="102" y="374" width="210" height="112" rx="18" fill="#ffffff" stroke="#91c8a2" stroke-width="3"/>
    <rect x="102" y="528" width="210" height="112" rx="18" fill="#ffffff" stroke="#d4a45f" stroke-width="3"/>
    <text x="207" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#2b5f96">Vision</text>
    <text x="207" y="306" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#607083">Observation</text>
    <text x="207" y="418" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#34754b">Language</text>
    <text x="207" y="460" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#607083">Instruction</text>
    <text x="207" y="572" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#9a6b21">Action</text>
    <text x="207" y="614" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#607083">Control</text>
  </g>

  <g stroke="#36516f" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M325 276 C410 276 433 322 503 336"/>
    <path d="M325 430 C407 430 436 408 503 392"/>
    <path d="M325 584 C414 584 439 495 511 455"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M502 286 H724 L667 494 H559 Z" fill="#fff7e8" stroke="#d18c30" stroke-width="4"/>
    <text x="613" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#9b6019">Evaluation</text>
    <text x="613" y="399" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#9b6019">Bottleneck</text>
    <line x1="535" y1="430" x2="691" y2="430" stroke="#d18c30" stroke-width="3"/>
    <text x="613" y="464" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#75512a">tasks, metrics, protocols</text>
  </g>

  <g stroke="#36516f" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M728 390 H825"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="846" y="225" width="240" height="96" rx="18" fill="#ffffff" stroke="#8b98aa" stroke-width="3"/>
    <rect x="846" y="348" width="240" height="96" rx="18" fill="#ffffff" stroke="#8b98aa" stroke-width="3"/>
    <rect x="846" y="471" width="240" height="96" rx="18" fill="#ffffff" stroke="#8b98aa" stroke-width="3"/>
    <text x="966" y="283" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#2c3d52">Benchmarks</text>
    <text x="966" y="406" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#2c3d52">Diagnostics</text>
    <text x="966" y="529" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#2c3d52">Deployment</text>
  </g>

  <text x="600" y="668" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#5f6f80">Vision-Language-Action models need evaluation before scaling.</text>
</svg>
